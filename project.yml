name: EngSoundly
options:
  bundleIdPrefix: ai.univs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  EngSoundly:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "PhonemeCTC.mlpackage"
          # actool is broken on this machine (SDK/runtime mismatch) — icons
          # ship as plain PNGs via CFBundleIcons instead. Restore the asset
          # catalog when building for App Store on a healthy Xcode install.
          - "Assets.xcassets"
      # Core ML model compiles to .mlmodelc at build time via the sources phase
      - path: Resources/PhonemeCTC.mlpackage
        buildPhase: sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: EngSoundly
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 발음을 녹음하고 분석하기 위해 마이크 접근이 필요합니다.
        NSSpeechRecognitionUsageDescription: 말한 단어와 문장을 알아듣기 위해 음성 인식이 필요합니다.
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        PRODUCT_BUNDLE_IDENTIFIER: ai.univs.engsoundly
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        COREML_CODEGEN_LANGUAGE: None
# NOTE: unit tests live in Tests/ and run on macOS via SwiftPM (`swift test`,
# see Package.swift) — this Xcode install can't run simulator test destinations.
